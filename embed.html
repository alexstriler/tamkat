<!doctype html>

<!-- Trimmed for embedding inside another page (Google Sites, Canvas, a district
     site). The host page supplies its own heading, so the hero and the card
     sections are dropped and only the filters and directory remain. -->
<body class="is-embed">

<section class="directory" aria-labelledby="directory-heading">
  <div class="wrap">
    <h2 class="directory__heading" id="directory-heading">What do you want students to do?</h2>
    <p class="directory__sub">Every resource, in one view. Click one to open it.</p>
    <div class="directory__grid" id="directory"></div>
  </div>
</section>

<main id="main">
  <div class="wrap">
    <p class="noresults" id="noresults" hidden>Nothing matches those filters yet.</p>
  </div>
</main>

<button type="button" class="backup" id="backup" hidden><span class="backup__arrow" aria-hidden="true">&uarr;</span><span>All categories</span></button>

<footer class="footer">
  <div class="wrap">
    <p class="footer__status" id="datastatus"></p>
    <p class="footer__credit">Compiled by Alex Striler &middot;
      <a href="https://alexstriler.github.io/tamkat/" target="_blank" rel="noopener">Open the full page</a></p>
  </div>
</footer>

<script src="data/fallback.js?v=7"></script>
<script src="assets/app.js?v=7"></script>
</body>
</html>
